[package]
name = "mitten"
version = "0.1.10"
edition = "2024"
description = "A personal agent you chat with in the terminal or over Discord"
license = "MIT OR Apache-2.0"
repository = "https://github.com/xianyuntang/mitten"

[dependencies]
anyhow = "1.0.104"
base64 = "0.22"
chromiumoxide = "0.9.1"
chrono = "0.4.45"
chrono-tz = "0.10.4"
croner = "4.0.0"
futures = "0.3"
html2text = "0.17.1"
iana-time-zone = "0.1.65"
ratatui = { version = "0.30.2", features = ["unstable-rendered-line-info"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
rig-core = "0.42.0"
rmcp = { version = "3.4.1", default-features = false, features = ["client", "transport-child-process", "transport-streamable-http-client-reqwest"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serenity = { version = "0.12.5", default-features = false, features = ["client", "gateway", "model", "rustls_backend"] }
tokio = { version = "1.53.1", features = ["full"] }
toml = "1.1.6"
toml_edit = "0.25.15"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
unicode-width = "0.2.2"
