# Mitten config. Easiest: run `mitten configure`, which writes ~/.config/mitten/config.toml for you.
# Or copy this file there, or pass a path: `mitten --config path/to/config.toml`.

# Optional. Your IANA time zone, for the time stamped on each message and scheduled jobs. Defaults
# to this machine's (`TZ`, else the system setting); set it when Mitten runs somewhere else, like a
# UTC server.
# `mitten configure` sets it under Advanced.
# timezone = "Asia/Taipei"

[model]
# Optional. Any OpenCode Go model, e.g. minimax-m3, qwen3.8-max, glm-5.3, kimi-k3, deepseek-v4-pro.
name = "minimax-m3"
# Optional. "anthropic" (/messages) or "openai" (/chat/completions); guessed from the name:
# minimax*/qwen* use anthropic, everything else openai.
# api = "anthropic"
# Optional. Default 16000.
# max_tokens = 16000
# Optional. When the conversation grows past about this many tokens, older turns are replaced by
# a summary so requests stay within the model's context window. Default 100000.
# compact_at_tokens = 100000

[opencode-go]
api_key = "your-opencode-api-key"
# Optional. ".../messages" is appended.
# base_url = "https://opencode.ai/zen/go/v1"

# Optional. Enables the `web_search` tool through your SearXNG instance.
# Its settings.yml must list `json` under search.formats, or searches get HTTP 403.
# [tools.searxng]
# url = "https://search.example.com"
# # Optional basic auth; set both or neither. Use https so the password isn't sent in the clear.
# username = "me"
# password = "secret"
# # Optional. Results per search, 1-20. Default 5.
# results = 5

# Optional. Enables the `claude_code` tool: the model hands coding tasks to Claude Code
# (`claude -p`), which must be installed and logged in. Each task asks for approval first.
# [tools.claude_code]
# # Required. Claude Code may only work in these directories and below them.
# dirs = ["~/repos"]
# # "acceptEdits" (default) lets it edit files, "plan" only plans, "default" allows neither
# # without allowed_tools. bypassPermissions is refused.
# permission_mode = "acceptEdits"
# # Optional. Tools it may use without asking, e.g. commands it can run.
# allowed_tools = ["Bash(cargo test:*)", "Bash(git diff:*)"]
# # Optional. Default 1800.
# timeout_secs = 1800

# Optional. MCP servers whose tools the model can call, named `<server>__<tool>`.
# Every call asks you first; set `approve = false` only for servers that can't change anything.
# A local server over stdio:
# [mcp.servers.github]
# command = "npx"
# args = ["-y", "@modelcontextprotocol/server-github"]
# env = { GITHUB_PERSONAL_ACCESS_TOKEN = "ghp_..." }
# A remote server over streamable HTTP, with an optional bearer token:
# [mcp.servers.docs]
# url = "https://example.com/mcp"
# token = "secret"
# approve = false

# Optional. How MCP calls and settings changes get approved. "ask" (default) asks you every time;
# "auto" lets a reviewer model pass low-risk actions and asks you about the rest.
# [approval]
# mode = "auto"
# # Optional. Reviewer model; defaults to model.name. A small fast one is enough.
# model = "glm-5.3-flash"

[log]
# tracing filter, e.g. "warn", "info", "mitten=debug".
level = "warn"

# Optional. Conversation history (SQLite); send /new to start over.
# [database]
# path = "/Users/you/.local/share/mitten/mitten.db"

# Optional. Needed for `mitten serve`: chat with Mitten by DM to your Discord bot.
# [discord]
# token = "your-bot-token"
# # Only these Discord user IDs can talk to the bot (it can read files on this machine).
# allowed_users = [123456789012345678]
# # The bot answers these users in DMs and in every server channel it can read, no @mention needed.
# # Enable the MESSAGE CONTENT intent for the bot in the Developer Portal, or it cannot connect.
