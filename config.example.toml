# Mitten config. Easiest: run `mitten configure`, which writes ~/.config/mitten/config.toml for you.
# Or copy this file there, or pass a path: `mitten --config path/to/config.toml`.

[model]
# Optional. Any OpenCode Go model, e.g. minimax-m3, qwen3.8-max, glm-5.3, kimi-k3, deepseek-v4-pro.
name = "minimax-m3"
# Optional. "anthropic" (/messages) or "openai" (/chat/completions); guessed from the name:
# minimax*/qwen* use anthropic, everything else openai.
# api = "anthropic"
# Optional. Default 16000.
# max_tokens = 16000
# Optional. When the conversation grows past about this many tokens, older turns are replaced by
# a summary so requests stay within the model's context window. Default 100000.
# compact_at_tokens = 100000

[opencode-go]
api_key = "your-opencode-api-key"
# Optional. ".../messages" is appended.
# base_url = "https://opencode.ai/zen/go/v1"

# Optional. Enables the `web_search` tool through your SearXNG instance.
# Its settings.yml must list `json` under search.formats, or searches get HTTP 403.
# [tools.searxng]
# url = "https://search.example.com"
# # Optional basic auth; set both or neither. Use https so the password isn't sent in the clear.
# username = "me"
# password = "secret"
# # Optional. Results per search, 1-20. Default 5.
# results = 5

[log]
# tracing filter, e.g. "warn", "info", "mitten=debug".
level = "warn"

# Optional. Conversation history (SQLite); send /new to start over.
# [database]
# path = "/Users/you/.local/share/mitten/mitten.db"

# Optional. Needed for `mitten serve`: chat with Mitten by DM to your Discord bot.
# [discord]
# token = "your-bot-token"
# # Only these Discord user IDs can talk to the bot (it can read files on this machine).
# allowed_users = [123456789012345678]
# # The bot answers these users in DMs and in every server channel it can read, no @mention needed.
# # Enable the MESSAGE CONTENT intent for the bot in the Developer Portal, or it cannot connect.
